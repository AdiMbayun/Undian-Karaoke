<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Karaoke Undian</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    90deg,
                    #064de0 0%,
                    #173c91 25%,
                    #151525 50%,
                    #8b1720 75%,
                    #e21e2b 100%
                );

            color: white;

        }


        /* =========================================
           LOGIN BOX
        ========================================= */

        .login-box {

            width: 380px;

            max-width: 90%;

            padding: 35px;

            background: rgba(0, 0, 0, 0.55);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);

            text-align: center;

        }


        /* =========================================
           JUDUL
        ========================================= */

        .login-box h1 {

            margin: 0 0 8px;

            font-size: 30px;

        }


        .subtitle {

            margin-bottom: 30px;

            color: rgba(255, 255, 255, 0.75);

            font-size: 14px;

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-group {

            text-align: left;

            margin-bottom: 18px;

        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

        }


        .input-group input {

            width: 100%;

            padding: 13px 15px;

            border: none;

            outline: none;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 15px;

            border: 1px solid rgba(255, 255, 255, 0.15);

        }


        .input-group input::placeholder {

            color: rgba(255, 255, 255, 0.5);

        }


        .input-group input:focus {

            border-color: rgba(255, 255, 255, 0.6);

            background: rgba(255, 255, 255, 0.16);

        }


        /* =========================================
           BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #064de0,
                    #e21e2b
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.3);

        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 8px;

            background: rgba(255, 50, 50, 0.2);

            border: 1px solid rgba(255, 100, 100, 0.4);

            color: #ffb3b3;

            font-size: 14px;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: 25px;

            font-size: 12px;

            color: rgba(255, 255, 255, 0.45);

        }

    </style>

</head>


<body>


    <div class="login-box">


        <h1>🎤 KARAOKE UNDIAN</h1>


        <div class="subtitle">
            Silakan login untuk melanjutkan
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('login') }}">


            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                🔐 LOGIN

            </button>


        </form>


        <div class="footer">

            Karaoke Undian

        </div>


    </div>


</body>

</html>
